[project]
name = "taxi"
version = "0.1.0"
description = "Projet de résolution du problème de taxi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo[recommended]",
    "matplotlib>=3.10.9",
    "networkx",
    "pydantic",
    "typer",
]

[project.scripts]
taxi = "taxi.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi"]
